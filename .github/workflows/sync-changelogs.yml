name: Sync and Publish Changelogs

on:
  push:
    branches: ["master"]
  repository_dispatch:
    types: [sync-changelog]
  workflow_dispatch:

# Every run reconciles every source, so the newest queued run also heals any
# dispatch that was superseded while another publication was still running.
concurrency:
  group: changelog-sync-and-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      dashboard_version: ${{ steps.versions.outputs.dashboard }}
      server_version: ${{ steps.versions.outputs.server }}
      godot_version: ${{ steps.versions.outputs.godot }}
      unity_version: ${{ steps.versions.outputs.unity }}
      unreal_version: ${{ steps.versions.outputs.unreal }}
      simple_server_version: ${{ steps.versions.outputs.simple_server }}
      mcp_version: ${{ steps.versions.outputs.mcp }}

    steps:
      - name: Checkout changelog repo
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Report reconciliation trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          echo "Running full changelog reconciliation"
          echo "Event: ${EVENT_NAME}"
          echo "Requested source: ${REQUESTED_SOURCE:-all}"

      - name: Sync Dashboard changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-Dashboard/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > dashboard-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: Dashboard Changelog
          ---

          # Dashboard Changelog

          All notable changes to the horizOn Dashboard (Frontend).

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> dashboard-changelog.md

      - name: Sync Server changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-Server/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > server-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: Server Changelog
          ---

          # Server Changelog

          All notable changes to the horizOn Server (Backend API).

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> server-changelog.md

      - name: Sync Godot SDK changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-SDK-Godot/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > godot-sdk-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: Godot SDK Changelog
          ---

          # Godot SDK Changelog

          All notable changes to the horizOn Godot SDK.

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> godot-sdk-changelog.md

      - name: Sync Unity SDK changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-SDK-Unity/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > unity-sdk-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: Unity SDK Changelog
          ---

          # Unity SDK Changelog

          All notable changes to the horizOn Unity SDK.

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> unity-sdk-changelog.md

      - name: Sync Unreal SDK changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-SDK-Unreal/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > unreal-sdk-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: Unreal SDK Changelog
          ---

          # Unreal SDK Changelog

          All notable changes to the horizOn Unreal SDK.

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> unreal-sdk-changelog.md

      - name: Sync Simple Server changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-simpleServer/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > simple-server-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: Simple Server Changelog
          ---

          # Simple Server Changelog

          All notable changes to the horizOn Simple Server.

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> simple-server-changelog.md

      - name: Sync MCP Server changelog
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          CONTENT=$(gh api repos/ProjectMakersDE/horizOn-mcp/contents/CHANGELOG.md --jq '.content' | base64 -d)
          cat > mcp-server-changelog.md << 'FRONTMATTER'
          ---
          layout: default
          title: MCP Server Changelog
          ---

          # MCP Server Changelog

          All notable changes to the horizOn MCP Server.

          [Back to Overview](.)

          FRONTMATTER
          echo "$CONTENT" >> mcp-server-changelog.md

      - name: Update index version badges
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          extract_version() {
            local file="$1"
            local version
            version=$(grep -m1 -oP '##? \[\K\d+\.\d+\.\d+' "$file")
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "No valid release version found in $file" >&2
              exit 1
            fi
            printf '%s' "$version"
          }

          DASH_VER=$(extract_version dashboard-changelog.md)
          SERV_VER=$(extract_version server-changelog.md)
          GODOT_VER=$(extract_version godot-sdk-changelog.md)
          UNITY_VER=$(extract_version unity-sdk-changelog.md)
          UNREAL_VER=$(extract_version unreal-sdk-changelog.md)
          SIMPLE_VER=$(extract_version simple-server-changelog.md)
          MCP_VER=$(extract_version mcp-server-changelog.md)

          sed -i "/<h3>Dashboard<\/h3>/,/<\/a>/ s|<span class=\"version\">v[0-9.]*</span>|<span class=\"version\">v${DASH_VER}</span>|" index.md
          sed -i "/<h3>Server API<\/h3>/,/<\/a>/ s|<span class=\"version\">v[0-9.]*</span>|<span class=\"version\">v${SERV_VER}</span>|" index.md
          sed -i "/<h3>Godot SDK<\/h3>/,/<\/a>/ s|<span class=\"version\">v[0-9.]*</span>|<span class=\"version\">v${GODOT_VER}</span>|" index.md
          sed -i "/<h3>Unity SDK<\/h3>/,/<\/a>/ s|<span class=\"version\">.*</span>|<span class=\"version\">v${UNITY_VER}</span>|" index.md
          sed -i "/<h3>Unreal SDK<\/h3>/,/<\/a>/ s|<span class=\"version\">.*</span>|<span class=\"version\">v${UNREAL_VER}</span>|" index.md
          sed -i "/<h3>Simple Server<\/h3>/,/<\/a>/ s|<span class=\"version\">.*</span>|<span class=\"version\">v${SIMPLE_VER}</span>|" index.md
          sed -i "/<h3>MCP Server<\/h3>/,/<\/a>/ s|<span class=\"version\">.*</span>|<span class=\"version\">v${MCP_VER}</span>|" index.md

          for version in "$DASH_VER" "$SERV_VER" "$GODOT_VER" "$UNITY_VER" "$UNREAL_VER" "$SIMPLE_VER" "$MCP_VER"; do
            grep -Fq "<span class=\"version\">v${version}</span>" index.md
          done

          echo "dashboard=$DASH_VER" >> "$GITHUB_OUTPUT"
          echo "server=$SERV_VER" >> "$GITHUB_OUTPUT"
          echo "godot=$GODOT_VER" >> "$GITHUB_OUTPUT"
          echo "unity=$UNITY_VER" >> "$GITHUB_OUTPUT"
          echo "unreal=$UNREAL_VER" >> "$GITHUB_OUTPUT"
          echo "simple_server=$SIMPLE_VER" >> "$GITHUB_OUTPUT"
          echo "mcp=$MCP_VER" >> "$GITHUB_OUTPUT"

      - name: Commit reconciled changelogs
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            dashboard-changelog.md \
            server-changelog.md \
            godot-sdk-changelog.md \
            unity-sdk-changelog.md \
            unreal-sdk-changelog.md \
            simple-server-changelog.md \
            mcp-server-changelog.md \
            index.md

          if git diff --staged --quiet; then
            echo "All changelogs are already current"
          else
            git commit -m "chore: reconcile changelogs"
            git push origin HEAD:master
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout reconciled changelogs
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.commit }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ needs.sync.outputs.commit }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: [sync, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published changelog versions
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DASHBOARD_VERSION: ${{ needs.sync.outputs.dashboard_version }}
          SERVER_VERSION: ${{ needs.sync.outputs.server_version }}
          GODOT_VERSION: ${{ needs.sync.outputs.godot_version }}
          UNITY_VERSION: ${{ needs.sync.outputs.unity_version }}
          UNREAL_VERSION: ${{ needs.sync.outputs.unreal_version }}
          SIMPLE_SERVER_VERSION: ${{ needs.sync.outputs.simple_server_version }}
          MCP_VERSION: ${{ needs.sync.outputs.mcp_version }}
        run: |
          set -euo pipefail
          base_url=${PAGE_URL%/}

          for attempt in {1..12}; do
            failed=0
            for page_and_version in \
              "dashboard-changelog.html:$DASHBOARD_VERSION" \
              "server-changelog.html:$SERVER_VERSION" \
              "godot-sdk-changelog.html:$GODOT_VERSION" \
              "unity-sdk-changelog.html:$UNITY_VERSION" \
              "unreal-sdk-changelog.html:$UNREAL_VERSION" \
              "simple-server-changelog.html:$SIMPLE_SERVER_VERSION" \
              "mcp-server-changelog.html:$MCP_VERSION"; do
              page=${page_and_version%%:*}
              version=${page_and_version#*:}
              if ! body=$(curl -fsSL \
                --connect-timeout 5 \
                --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "${base_url}/${page}?deployment=${GITHUB_RUN_ID}-${attempt}"); then
                echo "Waiting for ${page} to become reachable"
                failed=1
                continue
              fi

              if ! grep -Fq "$version" <<< "$body"; then
                echo "Waiting for ${page} to publish ${version}"
                failed=1
              fi
            done

            if [ "$failed" -eq 0 ]; then
              echo "All changelog pages expose the reconciled versions"
              exit 0
            fi

            sleep 5
          done

          echo "Published changelog verification timed out" >&2
          exit 1
